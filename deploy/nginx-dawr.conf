# Dawr's site for nginx. Copy to /etc/nginx/sites-available/dawr and link it into
# sites-enabled. Plain HTTP only: `certbot --nginx -d dawr.hifzapp.link` adds the
# HTTPS part and the redirect, as it did for the other sites on this server.
server {
    listen 80;
    server_name dawr.hifzapp.link;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app trusts the last X-Forwarded-For entry for rate limits, so set it
        # to the real visitor and drop anything the visitor sent
        # (not $proxy_add_x_forwarded_for, which keeps it).
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
