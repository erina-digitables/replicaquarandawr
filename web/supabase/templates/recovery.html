<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#fafafa;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:#18181b">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e4e4e7;border-radius:16px">
      <tr>
        <td style="padding:32px">
          <p style="margin:0 0 4px;font-size:20px;font-weight:800">Your reset code</p>
          <p style="margin:0 0 20px;font-size:15px;line-height:22px;color:#52525b">
            Enter this code on the Dawr reset screen to choose a new password. It works for 15 minutes.
          </p>
          <p style="margin:0 0 24px;font-family:'JetBrains Mono',Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
          <p style="margin:0;font-size:13px;line-height:20px;color:#52525b">
            Didn't ask for this? You can ignore it. Your password stays the same until someone enters this code.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
